# =============================================================================
# WIREPLUMBER ALSA SOFT MIXER CONFIGURATION
# Decouples user volume sliders (Noctalia/pavucontrol) from hardware ALSA gain.
# Prevents volume sliders from blowing out ALC256 Capture & Mic Boost to +60dB.
# =============================================================================

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.*"
      },
      {
        node.name = "~alsa_input.*"
      },
      {
        node.name = "~alsa_output.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
