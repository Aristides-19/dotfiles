# =============================================================================
# NOCTALIA CONFIGURATION FILE
# Dynamic Shell, Bar, Theming & Widget Definitions
# =============================================================================

# -----------------------------------------------------------------------------
# GLOBAL ACCESSIBILITY & AUDIO SETTINGS
# -----------------------------------------------------------------------------
[accessibility]
ui_scale = 1.10

[audio]
enable_sounds = true

[location]
address = "Caracas, Venezuela"

[system.monitor]
gpu_poll_seconds = 2

# -----------------------------------------------------------------------------
# POWER & BATTERY HOOKS
# -----------------------------------------------------------------------------
[hooks]
battery_discharging = "~/.local/share/scripts/on_battery.sh"
battery_charging = "~/.local/share/scripts/on_ac.sh"
battery_plugged = "~/.local/share/scripts/on_ac.sh"

[battery]
warning_threshold = 25

# -----------------------------------------------------------------------------
# TOP BAR CONFIGURATION
# -----------------------------------------------------------------------------
[bar.default]
thickness = 35
scale = 1.00
background_opacity = 0.50
widget_spacing = 12
capsule_radius = 4
capsule_thickness = 0.75
concave_edge_corners = false
font_family = "JetBrains Mono"
font_weight = 600
margin_edge = 0
margin_ends = 0
radius_bottom_left = 12
radius_bottom_right = 12
radius_top_left = 0
radius_top_right = 0

# Bar Section Layouts
start = ["group:g_left", "spacer_medium", "group:g1"]
center = ["workspaces", "spacer_large", "active_window"]
end = [
    "media",
    "spacer_large",
    "tray",
    "spacer_small",
    "group:g_right",
    "spacer_medium",
    "session",
]

# Capsule Groups
[[bar.default.capsule_group]]
id = "g_left"
members = ["launcher", "clock"]
opacity = 0
padding = 4

[[bar.default.capsule_group]]
id = "g_right"
members = ["notifications", "udiskie", "keymap", "network", "volume", "battery"]
opacity = 0
padding = 4

# Sysmon Capsule Group inside Bar
[[bar.default.capsule_group]]
id = "g1"
members = ["temp", "sysmon_2", "sysmon_3"]
opacity = 0
padding = 4

# -----------------------------------------------------------------------------
# BAR WIDGET DEFINITIONS
# -----------------------------------------------------------------------------
[widget.launcher]
color = "secondary"

[widget.clock]
color = "secondary"
format = "{:%H:%M %A %m/%d/%y}"

[widget.workspaces]
show_labels = false
capsule = false
active_pill_size = 2.5
inactive_pill_size = 1.0
pill_scale = 0.80

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.tray]
capsule = true
capsule_opacity = 0

[widget.keymap]
type = "blackbartblues/keymap:widget"
color = "secondary"

[widget.udiskie]
type = "aristides/udiskie:status"
color = "secondary"

[widget.notifications]
color = "secondary"

[widget.network]
color = "secondary"

[widget.volume]
color = "secondary"

[widget.battery]
show_label = true
color = "secondary"
warning_color = "error"
hide_when_full = true
hide_when_plugged = false

[widget.session]
color = "error"

# System Monitor Widgets
[widget.temp]
show_value = false

[widget.sysmon_2]
type = "sysmon"
glyph = "gpu-usage"
stat = "gpu_temp"
show_value = false

[widget.sysmon_3]
type = "sysmon"
glyph = "cpu-2"
stat = "ram_used"

# Spacers
[widget.spacer_large]
type = "spacer"

[widget.spacer_medium]
type = "spacer"
length = 12

[widget.spacer_small]
type = "spacer"
length = 6


# -----------------------------------------------------------------------------
# DOCK CONFIGURATION
# -----------------------------------------------------------------------------
[dock]
enabled = true
background_opacity = 0.50
icon_size = 32
launcher_position = "end"
pinned = ["zen"]
radius = 6
reserve_space = false
show_dots = true
smart_auto_hide = true


# -----------------------------------------------------------------------------
# HOT CORNERS & IDLE (POWER MANAGEMENT)
# -----------------------------------------------------------------------------
[hot_corners]
enabled = true

[hot_corners.top_left]
action = "window_switcher"

[idle]
behavior_order = ["lock", "screen-off", "lock-and-suspend"]

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 600.0

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 660.0

[idle.behavior.lock-and-suspend]
action = "lock_and_suspend"
enabled = true
timeout = 900.0

[lockscreen]
fingerprint = false


# -----------------------------------------------------------------------------
# SHELL, SCREENSHOTS & SESSION ACTIONS
# -----------------------------------------------------------------------------
[shell]
button_borders = false
card_borders = false
input_borders = false
font_family = "Inter Display Medium"
external_ip_enabled = true
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = true
clipboard_image_action_command = "satty -f -"
corner_radius_scale = 0.5

[shell.panel]
borders = false
open_near_click_control_center = true
session_placement = "floating"
session_position = "center"
transparency_mode = "glass"

# -----------------------------------------------------------------------------
# CONTROL CENTER SHORTCUTS
# -----------------------------------------------------------------------------
[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "power_profile"

[[control_center.shortcuts]]
type = "keyboard_layout"

[shell.screenshot]
copy_to_clipboard = true
pipe_command = "satty -f -"
pipe_to_command = true
save_to_file = false

# Session Power Menu Buttons
[[shell.session.actions]]
action = "lock"
countdown_seconds = 0.0
enabled = true
shortcut = "1"
variant = "default"

[[shell.session.actions]]
action = "logout"
countdown_seconds = 0.0
enabled = true
shortcut = "2"
variant = "default"

[[shell.session.actions]]
action = "lock_and_suspend"
countdown_seconds = 3.0
enabled = true
shortcut = "3"
variant = "default"

[[shell.session.actions]]
action = "reboot"
countdown_seconds = 3.0
enabled = true
shortcut = "4"
variant = "default"

[[shell.session.actions]]
action = "shutdown"
countdown_seconds = 3.0
enabled = true
shortcut = "5"
variant = "destructive"


# -----------------------------------------------------------------------------
# THEMING & DYNAMIC COLOR TEMPLATES
# -----------------------------------------------------------------------------
[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "vibrant"

[theme.templates]
builtin_ids = ["btop", "gtk3", "gtk4", "hyprland", "kitty", "qt"]
community_ids = ["opencode", "prismlauncher", "steam", "lazygit"]

[theme.templates.user.mpv]
input_path = "~/.config/noctalia/templates/mpv/modernz.conf.template"
output_path = "~/.config/mpv/script-opts/modernz.conf"

[wallpaper]
transition_on_startup = true
